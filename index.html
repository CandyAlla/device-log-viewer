          payload.slice(0, name.length + 1).toLocaleLowerCase() === `${name}:`.toLocaleLowerCase()
        );
        if (!platform) return null;
        const eventPayload = payload.slice(platform.length + 1).trim();
        const singleParameterMatch = eventPayload.match(/^eventName=([^,]+),Name=([^,]+),Value=(.*)$/i);
        if (singleParameterMatch) {
          return {
            eventName: singleParameterMatch[1].trim(),
            platform,
            parameters: [{ key: singleParameterMatch[2].trim(), value: singleParameterMatch[3].trim() }],
            timestamp: analyticsTimestamp(line)
          };
        }

        const parameterSeparator = eventPayload.indexOf(":");
        const eventName = (parameterSeparator < 0 ? eventPayload : eventPayload.slice(0, parameterSeparator)).trim();
        if (!eventName) return null;
        return {
          eventName,
          platform,
          parameters: parameterSeparator < 0 ? [] : parseAnalyticsParameters(eventPayload.slice(parameterSeparator + 1)),
          timestamp: analyticsTimestamp(line)
        };
      };

      const addLog = (line) => {
        const analyticsData = parseAnalyticsLog(line);
        const isAnalytics = Boolean(analyticsLogMarker && line.toLocaleLowerCase().includes(analyticsLogMarker));
        logs.push({
          number: nextLineNumber++,
          text: line,
          level: parseLevel(line),
          analytics: isAnalytics,
          analyticsData
        });
        if (logs.length > MAX_LINES) logs.splice(0, logs.length - MAX_LINES);
        updateButtons();
        if (!paused) scheduleRender();
        else updateCount();
      };

      const enabledLevels = () => new Set(elements.levelInputs.filter(input => input.checked).map(input => input.value));

      const currentFilter = () => elements.searchInput.value.trim().toLocaleLowerCase();

      const matchesFilters = (log, levels, filter, analyticsOnly) => {
        return levels.has(log.level)
          && (!analyticsOnly || log.analytics)
          && (!filter || log.text.toLocaleLowerCase().includes(filter));
      };

      const getVisibleLogs = (
        levels = enabledLevels(),
        filter = currentFilter(),
        analyticsOnly = elements.analyticsOnly.checked
      ) => {
        return logs.filter(log => matchesFilters(log, levels, filter, analyticsOnly));
      };

      const appendHighlightedText = (target, text, filter) => {
        if (!filter) {
          target.textContent = text;
          return;
        }
        const haystack = text.toLocaleLowerCase();
        let cursor = 0;
        let matchIndex = haystack.indexOf(filter);
        while (matchIndex !== -1) {
          target.append(document.createTextNode(text.slice(cursor, matchIndex)));
          const mark = document.createElement("mark");
          mark.textContent = text.slice(matchIndex, matchIndex + filter.length);
          target.append(mark);
          cursor = matchIndex + filter.length;
          matchIndex = haystack.indexOf(filter, cursor);
        }
        target.append(document.createTextNode(text.slice(cursor)));
      };

      const createAnalyticsElement = (log, filter) => {
        const data = log.analyticsData;
        const row = document.createElement("article");
        row.className = `log-line analytics-card level-${log.level === "?" ? "other" : log.level}`;
        row.dataset.number = String(log.number);
        row.title = log.text;

        const number = document.createElement("span");
        number.className = "line-no";
        number.textContent = log.number;

        const panel = document.createElement("div");
        panel.className = "analytics-panel";
        panel.setAttribute("aria-label", `${data.eventName} 埋点，${data.parameters.length} 个参数`);

        const header = document.createElement("header");
        header.className = "analytics-header";
        const name = document.createElement("span");
        name.className = "analytics-name";
        appendHighlightedText(name, data.eventName, filter);
        const platform = document.createElement("span");
        platform.className = "analytics-platform";
        appendHighlightedText(platform, data.platform, filter);
        header.append(name, platform);
        if (data.timestamp) {
          const timestamp = document.createElement("time");
          timestamp.className = "analytics-time";
          appendHighlightedText(timestamp, data.timestamp, filter);
          header.append(timestamp);
        }
        panel.append(header);

        if (data.parameters.length) {
          const parameters = document.createElement("div");
          parameters.className = "analytics-params";
          for (const parameter of data.parameters) {
            const item = document.createElement("span");
            item.className = "analytics-param";
            const key = document.createElement("span");
            key.className = "analytics-key";
            appendHighlightedText(key, `${parameter.key}:`, filter);
            const value = document.createElement("span");
            value.className = "analytics-value";
            appendHighlightedText(value, parameter.value, filter);
            item.append(key, value);
            parameters.append(item);
          }
          panel.append(parameters);
        } else {
          const noParameters = document.createElement("div");
          noParameters.className = "analytics-no-params";
          noParameters.textContent = "无参数";
          panel.append(noParameters);
        }

        row.append(number, panel);
        return row;
      };

      const createLogElement = (log, filter) => {
        if (log.analyticsData) return createAnalyticsElement(log, filter);
        const row = document.createElement("div");
        row.className = `log-line level-${log.level === "?" ? "other" : log.level}`;
        row.dataset.number = String(log.number);
        const number = document.createElement("span");
        number.className = "line-no";
        number.textContent = log.number;
        const text = document.createElement("span");
        text.className = "line-text";
        appendHighlightedText(text, log.text, filter);
        row.append(number, text);
        return row;
      };

      const render = () => {
        renderScheduled = false;
        if (paused) return;
        const shouldStick = elements.autoScroll.checked || elements.logView.scrollHeight - elements.logView.scrollTop - elements.logView.clientHeight < 60;
        const levels = enabledLevels();
        const filter = currentFilter();
        const analyticsOnly = elements.analyticsOnly.checked;
        const visible = getVisibleLogs(levels, filter, analyticsOnly);
        const signature = `${filter}\u0000${analyticsOnly ? "analytics" : "all"}\u0000${[...levels].sort().join("")}`;
        const fullRender = forceFullRender || signature !== renderedFilterSignature;

        if (fullRender) {
          const fragment = document.createDocumentFragment();
          for (const log of visible) fragment.append(createLogElement(log, filter));
          elements.logLines.replaceChildren(fragment);
          forceFullRender = false;
          renderedFilterSignature = signature;
        } else {
          const fragment = document.createDocumentFragment();
          for (const log of logs) {
            if (log.number <= renderedThrough) continue;
            if (matchesFilters(log, levels, filter, analyticsOnly)) {
              fragment.append(createLogElement(log, filter));
            }
          }
          elements.logLines.append(fragment);
          const firstRetainedNumber = logs[0]?.number ?? nextLineNumber;
          while (elements.logLines.firstElementChild && Number(elements.logLines.firstElementChild.dataset.number) < firstRetainedNumber) {
            elements.logLines.firstElementChild.remove();
          }
        }
        renderedThrough = logs.at(-1)?.number ?? 0;
        elements.emptyState.hidden = visible.length > 0;
        if (logs.length && !visible.length) {
          elements.emptyState.querySelector("strong").textContent = "没有匹配当前筛选条件的日志";
          elements.emptyState.querySelector("span").textContent = analyticsOnly
            ? `尚未发现 ${runtimeConfig.analytics.marker} 埋点日志，可操作 App 触发埋点或关闭“只看埋点”。`
            : "可修改关键词或重新勾选日志级别。";
        } else if (!logs.length) {
          elements.emptyState.querySelector("strong").textContent = captureState === "running" ? "等待设备输出日志…" : "选择日志来源和设备，然后点“开始”";
          elements.emptyState.querySelector("span").textContent = "日志会实时显示在这里，可随时筛选或下载。";
        }
        updateCount(visible.length);
        if (shouldStick) elements.logView.scrollTop = elements.logView.scrollHeight;
      };

      const scheduleRender = () => {
        if (renderScheduled) return;
        renderScheduled = true;
        requestAnimationFrame(render);
      };

      const updateCount = (visibleCount = getVisibleLogs().length) => {
        elements.lineCount.textContent = visibleCount === logs.length ? `${logs.length.toLocaleString()} 行` : `${visibleCount.toLocaleString()} / ${logs.length.toLocaleString()} 行`;
      };

      const clearView = () => {
        logs = [];
        nextLineNumber = 1;
        lastParsedLevel = "?";
        forceFullRender = true;
        renderedThrough = 0;
        scheduleRender();
        updateButtons();
      };

      const startCapture = async () => {
        const source = elements.sourceSelect.value;
        const serial = elements.deviceSelect.value;
        if (!serial) return;
        const appId = (elements.appOnly.checked || source === "ios-device") ? selectedAppId() : "";
        captureSource = source;
        hideNotice();
        elements.startButton.disabled = true;
        try {
          const { status } = await api("/api/start", {
            method: "POST",
            body: JSON.stringify({ source, serial, appId })
          });
          updateCaptureStatus(status);
          elements.logView.focus({ preventScroll: true });
        } catch (error) {
          showNotice(error.message);
          updateButtons();
        }
      };

      const stopCapture = async () => {
        elements.stopButton.disabled = true;
        try {
          const { status } = await api("/api/stop", { method: "POST", body: "{}" });
          updateCaptureStatus(status);
        } catch (error) {
          showNotice(error.message);
          updateButtons();
        }
      };

      const togglePause = () => {
        paused = !paused;
        elements.pauseButton.textContent = paused ? "继续显示" : "暂停显示";
        elements.pausedBadge.hidden = !paused;
        if (!paused) scheduleRender();
      };

      const clearDeviceLogs = async () => {
        const source = elements.sourceSelect.value;
        const serial = elements.deviceSelect.value;
        if (source !== "android" || !serial || !window.confirm("确定清空这台设备的整个 logcat 缓冲区吗？此操作无法撤销。")) return;
        elements.clearDeviceButton.disabled = true;
        try {
          await api("/api/clear-device", { method: "POST", body: JSON.stringify({ source, serial }) });
          clearView();
          elements.statusMessage.textContent = "设备日志缓冲区已清空";
        } catch (error) {
          showNotice(error.message);
        } finally {
          updateButtons();
        }
      };

      const downloadLogs = () => {
        const visible = getVisibleLogs();
        if (!visible.length) {
          showNotice("当前筛选结果为空，没有可下载的日志。");
          return;
        }
        const serial = (captureSerial || elements.deviceSelect.value || "device").replace(/[^a-zA-Z0-9._-]+/g, "-");
        const source = captureSource.replace(/[^a-zA-Z0-9._-]+/g, "-");
        const stamp = new Date().toISOString().replace(/[:.]/g, "-");
        const content = `${visible.map(log => log.text).join("\n")}\n`;
        const blob = new Blob([content], { type: "text/plain;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `${source}-log-${serial}-${stamp}.txt`;
        document.body.append(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      };

      const connectStream = () => {
        const stream = new EventSource("/api/stream");
        stream.onopen = () => {
          elements.streamState.textContent = "服务已连接";
          elements.streamState.className = "stream-state connected";
        };
        stream.onerror = () => {
          elements.streamState.textContent = "服务重连中…";
          elements.streamState.className = "stream-state disconnected";
        };
        stream.addEventListener("log", event => {
          const payload = JSON.parse(event.data);
          addLog(payload.line || "");
        });
        stream.addEventListener("status", event => updateCaptureStatus(JSON.parse(event.data)));
      };

      elements.sourceSelect.addEventListener("change", async () => {
        closeScreenStream("", "");
        appRequestId += 1;
        elements.deviceSelect.replaceChildren(new Option("正在查找设备…", ""));
        resetAppOptions();
        updateSourceUi();
        updateButtons();
        await refreshDevices();
        if (!elements.screenPanel.hidden && isScreenSource()) await refreshScreenTools();
      });
      elements.refreshButton.addEventListener("click", refreshDevices);
      elements.deviceSelect.addEventListener("change", async () => {
        closeScreenStream("", "");
        renderApkSelection();
        renderAndroidLinkInstaller();
        renderIosInstaller();
        updateButtons();
        await refreshApps();
        if (!elements.screenPanel.hidden && isScreenSource()) await refreshScreenTools();
      });
      elements.apkDropZone.addEventListener("click", () => {
        if (!apkInstalling && !apkLinkInstalling) elements.apkFileInput.click();
      });
      elements.apkDropZone.addEventListener("keydown", event => {
        if (!apkInstalling && !apkLinkInstalling && (event.key === "Enter" || event.key === " ")) {
          event.preventDefault();
          elements.apkFileInput.click();
        }
      });
      elements.apkFileInput.addEventListener("change", () => setApkFile(elements.apkFileInput.files?.[0]));
      elements.apkDropZone.addEventListener("dragover", event => {
        if (apkInstalling || apkLinkInstalling) return;
        event.preventDefault();
        event.dataTransfer.dropEffect = "copy";
        elements.apkDropZone.classList.add("dragging");
      });
      elements.apkDropZone.addEventListener("dragleave", event => {
        const relatedTarget = event.relatedTarget;
        if (!(relatedTarget instanceof Node) || !elements.apkDropZone.contains(relatedTarget)) {
          elements.apkDropZone.classList.remove("dragging");
        }
      });
      elements.apkDropZone.addEventListener("drop", event => {
        event.preventDefault();
        elements.apkDropZone.classList.remove("dragging");
        if (!apkInstalling && !apkLinkInstalling) setApkFile(event.dataTransfer.files?.[0]);
      });
      document.addEventListener("dragover", event => {
        if ([...(event.dataTransfer?.types || [])].includes("Files")) event.preventDefault();
      });
      document.addEventListener("drop", event => {
        if ([...(event.dataTransfer?.types || [])].includes("Files")) event.preventDefault();
      });
      elements.clearApkButton.addEventListener("click", clearApkFile);
      elements.installApkButton.addEventListener("click", installApk);
      elements.androidInstallUrl.addEventListener("input", updateButtons);
      elements.androidInstallUrl.addEventListener("keydown", event => {
        if (event.key === "Enter" && !elements.installAndroidLinkButton.disabled) {
          event.preventDefault();
          installApkFromLink();
        }
      });
      elements.installAndroidLinkButton.addEventListener("click", installApkFromLink);
      elements.iosInstallUrl.addEventListener("input", updateButtons);
      elements.iosInstallUrl.addEventListener("keydown", event => {
        if (event.key === "Enter" && !elements.installIosButton.disabled) {
          event.preventDefault();
          installIosFromLink();
        }
      });
      elements.installIosButton.addEventListener("click", installIosFromLink);
      elements.appOnly.addEventListener("change", updateButtons);
      elements.packageSelect.addEventListener("change", () => {
        updateButtons();
        if (elements.packageSelect.value === MANUAL_APP_VALUE) elements.packageInput.focus();
      });
      elements.packageInput.addEventListener("input", updateButtons);
      elements.refreshAppsButton.addEventListener("click", refreshApps);
      elements.startButton.addEventListener("click", startCapture);
      elements.stopButton.addEventListener("click", stopCapture);
      elements.pauseButton.addEventListener("click", togglePause);
      elements.clearViewButton.addEventListener("click", clearView);
      elements.clearDeviceButton.addEventListener("click", clearDeviceLogs);
      elements.downloadButton.addEventListener("click", downloadLogs);
      elements.screenPanelButton.addEventListener("click", toggleScreenPanel);
      elements.closeScreenPanelButton.addEventListener("click", closeScreenPanel);
      elements.screenLiveButton.addEventListener("click", toggleScreenStream);
      elements.screenScreenshotButton.addEventListener("click", captureScreenPng);
      elements.screenRecordButton.addEventListener("click", toggleScreenRecording);
      elements.screenQuality.addEventListener("change", () => setScreenMessage("画质设置将在下一次串流或录屏时生效。"));
      elements.screenCaptureSource.addEventListener("change", () => setScreenMessage("iPhone/iPad 画面来源将在下一次串流、截图或录屏时生效。"));
      elements.reconnectAdbButton.addEventListener("click", reconnectTools);
      elements.dismissNotice.addEventListener("click", hideNotice);
      elements.autoScroll.addEventListener("change", () => {
        if (elements.autoScroll.checked) elements.logView.scrollTop = elements.logView.scrollHeight;
      });
      elements.levelInputs.forEach(input => input.addEventListener("change", () => {
        forceFullRender = true;
        scheduleRender();
      }));
      elements.analyticsOnly.addEventListener("change", () => {
        forceFullRender = true;
        scheduleRender();
      });
      elements.searchInput.addEventListener("input", () => {
        window.clearTimeout(filterTimer);
        filterTimer = window.setTimeout(() => {
          forceFullRender = true;
          scheduleRender();
        }, 100);
      });
      document.addEventListener("keydown", event => {
        if ((event.metaKey || event.ctrlKey) && event.key.toLocaleLowerCase() === "f") {
          event.preventDefault();
          elements.searchInput.focus();
          elements.searchInput.select();
        }
      });
      window.addEventListener("beforeunload", () => {
        if (screenSocket) screenSocket.close();
      });

      const applyRuntimeConfig = (config) => {
        runtimeConfig = config;
        analyticsLogMarker = config.analytics.enabled ? config.analytics.marker.toLocaleLowerCase() : "";
        document.title = config.displayName;
        elements.brandTitle.textContent = config.displayName;
        elements.analyticsControl.hidden = !config.analytics.enabled;
        elements.analyticsOnly.checked = false;
        if (config.analytics.enabled) {
          elements.analyticsControl.title = `只显示包含 ${config.analytics.marker} 标记的埋点日志`;
          elements.analyticsOnlyText.textContent = "只看埋点";
        }
        resetAppOptions(defaultAppId());
      };

      const initialize = async () => {
        try {
          const { config } = await api("/api/config");
          applyRuntimeConfig(config);
        } catch (error) {
          applyRuntimeConfig(FALLBACK_CONFIG);
          showNotice(`Profile 加载失败：${error.message}`);
        }
        connectStream();
        updateSourceUi();
        refreshDevices();
        api("/api/status")
          .then(({ status, screenStatus }) => {
            updateCaptureStatus(status);
            if (screenStatus) updateScreenToolStatus(screenStatus);
          })
          .catch(error => showNotice(error.message));
      };

      initialize();
    })();
  </script>
</body>
</html>
